services:
  - type: web
    runtime: docker
    name: rtc
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: RIDDLE_CODE_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://trsyp3-0.onrender.com
      - key: CORS_ORIGINS
        value: https://trsyp3-0.onrender.com,https://rtc.ieee.tn,https://trsyp.ieee.tn
      - key: COMPETITION_REGISTRATION_PHASE
        value: open
      - key: CHALLENGE_REGISTRATION_PHASE
        value: soon
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_FEATURE_REGISTRATION_API
        value: "true"
      - key: NEXT_PUBLIC_FEATURE_ADMIN_API
        value: "false"
      - key: NEXT_PUBLIC_COMPETITION_PHASE
        value: open
      - key: NEXT_PUBLIC_CHALLENGE_PHASE
        value: soon
      - key: NEXT_PUBLIC_PARTICIPANT_REGISTRATION_OPEN
        value: "true"
